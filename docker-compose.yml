services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bdvisual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bdvisual"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  s3:
    # S3-compatible object storage for local dev (MinIO no longer ships public images)
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data

  backend:
    build: ./backend
    profiles: ["full"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/bdvisual
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  s3_data:
