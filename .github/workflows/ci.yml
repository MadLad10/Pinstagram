name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: bdvisual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d bdvisual"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/bdvisual
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install pgvector into the PostGIS service
        # Same steps as docker/postgres/Dockerfile (bullseye packages moved
        # to apt-archive.postgresql.org).
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "
            sed -i 's|apt.postgresql.org/pub/repos/apt|apt-archive.postgresql.org/pub/repos/apt|' /etc/apt/sources.list.d/pgdg.list &&
            apt-get update -qq && apt-get install -y -qq postgresql-15-pgvector"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations apply and roll back cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: AI eval (offline, fake providers)
        # Keeps the eval harness working; scores go to the job summary.
        run: python -m evals.run --out /tmp/evals >> "$GITHUB_STEP_SUMMARY"

  admin:
    name: Admin dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  mobile:
    name: Mobile + web app (typecheck, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Web build (what Vercel deploys)
        run: npx expo export --platform web
        env:
          CI: 1
