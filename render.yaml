# Render Blueprint for the API. Create it from the Render dashboard:
# New > Blueprint > pick this repo. Values marked `sync: false` are asked for
# during setup (see DEPLOY.md for where each one comes from).
services:
  - type: web
    name: pinstagram-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL # Neon connection string (postgres://...?sslmode=require)
        sync: false
      - key: REDIS_URL # Upstash, rediss://...
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://pinstagram.vercel.app
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: S3_ENDPOINT # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: pinstagram-media
      - key: S3_REGION
        value: auto
      - key: MEDIA_BASE_URL # R2 public bucket URL, https://pub-<id>.r2.dev
        sync: false
